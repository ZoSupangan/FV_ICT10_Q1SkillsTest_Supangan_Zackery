<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Los Marachi Grill</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { margin-bottom: 10px; }
        .menu { margin-bottom: 20px; }
        .receipt { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Los Marachi Grill</h1>

    <div class="menu">
        <label><input type="checkbox" value="120"> Plain Chicken (₱120)</label><br>
        <label><input type="checkbox" value="169"> BBQ Chicken (₱169)</label><br>
        <label><input type="checkbox" value="169"> Spicy Chicken (₱169)</label><br>
        <label><input type="checkbox" value="220"> Honey Chicken (₱220)</label><br>
        <label><input type="checkbox" value="220"> Caramel Chicken (₱220)</label><br>
    </div>

    <button onclick="createOrder()">Create Order</button>

    <div class="receipt" id="receipt"></div>

    <script>
        function createOrder() {
            let checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            let subtotal = 0;

            checkboxes.forEach(item => {
                subtotal += Number(item.value);
            });

            let vat = subtotal * 0.12;
            let total = subtotal + vat;

            document.getElementById("receipt").innerHTML =
                "==== Receipt ====<br>" +
                "Subtotal: ₱" + subtotal.toFixed(2) + "<br>" +
                "Tax: ₱" + vat.toFixed(2) + "<br>" +
                "Total: ₱" + total.toFixed(2);
        }
    </script>

</body>
</html>
